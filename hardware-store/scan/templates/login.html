<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      color: white;
      background-image: url('photos/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    
    header {
      font-family: 'Metal Mania', cursive;
      font-size: 60px;
      padding: 20px;
      margin-top: 40px;
      letter-spacing: 5px;
    }

    #entry {
      background-color: rgba(255, 255, 255, 0.05); /* thoda sa visible banane ke liye opacity badhai hai */
      width: 90%;
      max-width: 700px;
      margin: 40px auto 0 auto;
      box-sizing: border-box;
      padding: 20px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px); /* Safari support ke liye */
      border-radius: 40px;
      box-shadow: 0px 0px 20px 5px rgba(0, 0, 0, 0.5);
    }

    #entry p {
      font-family: sans-serif;
      font-size: 18px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    input {
      width: 90%;
      padding: 12px;
      margin-top: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 95%;
      padding: 12px;
      background-color: #007bff;
      border-radius: 15px;
      margin-top: 20px;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    form button:active {
      background-color: #0065d1;
    }
  </style>
</head>
<body>

  <header>Smart Island</header>

  <div id="entry">
    <h2>Login</h2>
    <form method="POST">
      <input type="password" name="password" placeholder="Password" autofocus>
      <br>
      <button type="submit">Enter</button>
    </form>
    <p style="color: #ff6b6b; margin-top: 15px;">{{ msg }}</p>
  </div>

</body>
</html>
